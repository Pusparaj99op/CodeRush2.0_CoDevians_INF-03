<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Veldar logo</title>
<desc>A minimalist royal red and white logo where the letter V is styled like a currency symbol with two horizontal strike bars, evoking value exchange, above the wordmark VELDAR.</desc>

<!-- Background -->
<rect width="600" height="600" fill="#FFFFFF"/>

<!-- Currency-style V mark -->
<g fill="none" stroke="#A6192E" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter">
  <!-- The V stem -->
  <path d="M180 130 L300 400 L420 130"/>
</g>

<!-- Horizontal strike bars, like the two bars in a currency glyph -->
<g stroke="#A6192E" stroke-width="18" stroke-linecap="square">
  <line x1="155" y1="205" x2="445" y2="205"/>
  <line x1="180" y1="260" x2="420" y2="260"/>
</g>

<!-- Wordmark -->
<text x="300" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="54" letter-spacing="10" fill="#A6192E" font-weight="700">VELDAR</text>

</svg>
