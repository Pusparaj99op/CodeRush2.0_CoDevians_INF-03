<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cardGradient" cx="72%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#ff3b0f"/>
      <stop offset="35%" stop-color="#e8280a"/>
      <stop offset="65%" stop-color="#8c1207"/>
      <stop offset="100%" stop-color="#2b0503"/>
    </radialGradient>

    <linearGradient id="edgeDarken" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1000" height="600" rx="34" ry="34"/>
    </clipPath>
  </defs>

  <!-- Card base -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1000" height="600" fill="url(#cardGradient)"/>
    <rect x="0" y="0" width="1000" height="600" fill="url(#edgeDarken)"/>

    <!-- subtle diagonal texture streak -->
    <rect x="0" y="0" width="1000" height="600" fill="#ffffff" opacity="0.03"
          transform="rotate(-8 500 300)"/>

    <!-- Big outlined wordmark "veldar" at bottom, clipped by card edges -->
    <text x="10" y="560"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="800"
          font-size="230"
          letter-spacing="-6"
          fill="none"
          stroke="#f5a623"
          stroke-width="3.5">veldar</text>

    <!-- VELDAR title -->
    <text x="65" y="150"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="800"
          font-size="58"
          letter-spacing="2"
          fill="#ffffff">VELDAR</text>

    <!-- Tagline -->
    <text x="65" y="195"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="700"
          font-size="22"
          letter-spacing="1.5"
          fill="#ffffff">BUILD • COLLABORATE • INNOVATE</text>

    <!-- Pill badge -->
    <rect x="63" y="222" width="270" height="46" rx="23" ry="23"
          fill="none" stroke="#f5a623" stroke-width="2.5"/>
    <circle cx="98" cy="245" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="93" y="250" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">C</text>
    <text x="124" y="253"
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-weight="700"
          font-size="21"
          fill="#ffffff">codevians.online</text>

    <!-- Chip -->
    <g transform="translate(830,240)">
      <rect x="0" y="0" width="100" height="76" rx="10" ry="10" fill="#d9b98a" stroke="#b8945f" stroke-width="1.5"/>
      <!-- chip contact segments -->
      <g fill="none" stroke="#a97f4d" stroke-width="1.5">
        <line x1="33" y1="0" x2="33" y2="76"/>
        <line x1="67" y1="0" x2="67" y2="76"/>
        <line x1="0" y1="25" x2="100" y2="25"/>
        <line x1="0" y1="51" x2="100" y2="51"/>
      </g>
      <rect x="33" y="25" width="34" height="26" fill="#c9a877" stroke="#a97f4d" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Card outline -->
  <rect x="1.5" y="1.5" width="997" height="597" rx="34" ry="34"
        fill="none" stroke="#000000" stroke-opacity="0.15" stroke-width="1"/>
</svg>
